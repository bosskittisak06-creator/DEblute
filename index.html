<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEBLUTE - สินค้า</title>
  <style>
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #e0d4c3;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .product-image-wrap {
      width: 100%;
      height: 180px;
      overflow: hidden;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>

  <div class="product-grid">
    <div class="product-card">
      <div class="product-image-wrap">
        <img src="742031123_1703379214204281_4669791615417934758_n.jpg" alt="Basket 001">
      </div>
      <h3>Basket 001</h3>
      <p>3,000 ฿</p>
      <button>หยิบใส่ตะกร้า</button>
    </div>

    <div class="product-card">
      <div class="product-image-wrap">
        <img src="761291198_1592695235632238_8879933037356348742_n.jpg" alt="Basket 002">
      </div>
      <h3>Basket 002</h3>
      <p>2,890 ฿</p>
      <button>หยิบใส่ตะกร้า</button>
    </div>

    <div class="product-card">
      <div class="product-image-wrap">
        <img src="773881683_1587262493112825_6046716291611405974_n.jpg" alt="Basket 003">
      </div>
      <h3>Basket 003</h3>
      <p>1,890 ฿</p>
      <button>หยิบใส่ตะกร้า</button>
    </div>

    <div class="product-card">
      <div class="product-image-wrap">
        <img src="772610423_1930232547654616_4269718751351377304_n.jpg" alt="Basket 004">
      </div>
      <h3>Basket 004</h3>
      <p>2,500 ฿</p>
      <button>หยิบใส่ตะกร้า</button>
    </div>
  </div>

</body>
</html>
