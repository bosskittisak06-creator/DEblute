<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEBLUTE - FLOWER DESIGN & HOUSE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }
    body {
      background-color: #fdfbf7;
      color: #4a4238;
      line-height: 1.6;
    }
    .top-bar {
      background-color: #e6dac8;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.85rem;
      color: #5c4e3e;
    }
    header {
      background-color: #f7f1e5;
      text-align: center;
      padding: 2rem 1rem;
      border-bottom: 1px solid #ebd3c3;
    }
    .brand-logo {
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #3b3123;
    }
    .brand-sub {
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #8c7355;
    }
    nav {
      background-color: #ffffff;
      border-bottom: 1px solid #ece4d8;
    }
    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      padding: 0.8rem 0;
      gap: 1.5rem;
    }
    nav a {
      text-decoration: none;
      color: #5c4e3e;
      font-size: 0.95rem;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .category-title {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #3b3123;
    }
    .category-subtitle {
      text-align: center;
      color: #8c7355;
      margin-bottom: 2rem;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    .product-card {
      background: #ffffff;
      border: 1px solid #f0e6d8;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .product-image-wrap {
      width: 100%;
      height: 200px;
      overflow: hidden;
      border-radius: 6px;
      margin-bottom: 0.8rem;
    }
    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #3b3123;
    }
    .price {
      font-weight: bold;
      color: #b05843;
      margin-bottom: 0.8rem;
    }
    .btn-cart {
      background-color: #5c4e3e;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    บริการจัดส่ง บริเวณ ซอย Kave Town Plum condo และ ม.กรุงเทพ
  </div>

  <header>
    <div class="brand-logo">DEBLUTE</div>
    <div class="brand-sub">FLOWER DESIGN & HOUSE</div>
  </header>

  <nav>
    <ul>
      <li><a href="#">หน้าหลัก</a></li>
      <li><a href="#">ดอกไม้กลิตเตอร์</a></li>
      <li><a href="#">ดอกไม้ผ้า</a></li>
      <li><a href="#">ดอกไม้กระดาษย่น</a></li>
      <li><a href="#">ติดต่อเรา</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2 class="category-title">สินค้าแนะนำ</h2>
    <p class="category-subtitle">เลือกสรรสินค้าคุณภาพจาก DEBLUTE</p>

    <div class="product-grid">
      <div class="product-card">
        <div class="product-image-wrap">
          <img src="742031123_1703379214204281_4669791615417934758_n.jpg" alt="Basket 001">
        </div>
        <h3>Basket 001</h3>
        <div class="price">3,000 ฿</div>
        <button class="btn-cart">หยิบใส่ตะกร้า</button>
      </div>

      <div class="product-card">
        <div class="product-image-wrap">
          <img src="761291198_1592695235632238_8879933037356348742_n.jpg" alt="Basket 002">
        </div>
        <h3>Basket 002</h3>
        <div class="price">2,890 ฿</div>
        <button class="btn-cart">หยิบใส่ตะกร้า</button>
      </div>

      <div class="product-card">
        <div class="product-image-wrap">
          <img src="773881683_1587262493112825_6046716291611405974_n.jpg" alt="Basket 003">
        </div>
        <h3>Basket 003</h3>
        <div class="price">1,890 ฿</div>
        <button class="btn-cart">หยิบใส่ตะกร้า</button>
      </div>

      <div class="product-card">
        <div class="product-image-wrap">
          <img src="772610423_1930232547654616_4269718751351377304_n.jpg" alt="Basket 004">
        </div>
        <h3>Basket 004</h3>
        <div class="price">2,500 ฿</div>
        <button class="btn-cart">หยิบใส่ตะกร้า</button>
      </div>
    </div>
  </div>

</body>
</html>
